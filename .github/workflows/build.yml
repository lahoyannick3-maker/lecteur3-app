name: Build Application Native Android Complete

on:
  push:
    branches: [ main, master ] # Se déclenche à chaque push

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code source
      uses: actions/checkout@v4

    - name: Configuration de Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configuration de Java JDK 17 (Requis pour compiler Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Installation des dépendances
      run: npm install

    - name: Initialisation ou vérification de la plateforme Android
      run: |
        if [ ! -d "android" ]; then
          echo "Le dossier Android n'existe pas. Création de la plateforme..."
          npx cap add android
        else
          echo "Le dossier Android existe déjà. Passage à la synchronisation."
        fi

    - name: Injection forcée des permissions de scan global et notifications
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        # Ajout des autorisations absolues pour scanner les dossiers, sous-dossiers et notifier l'utilisateur
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>' $MANIFEST
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>' $MANIFEST
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" \/>' $MANIFEST
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>' $MANIFEST

    - name: Déclaration de l'app comme lecteur de fichiers (PDF/Word/Excel)
      run: |
        # Ajoute des intent-filters VIEW ("Ouvrir avec") et SEND ("Partager
        # vers") sur MainActivity, pour que le telephone propose "Lecteur
        # Multi-Formats" quand on ouvre un PDF/Word/Excel depuis WhatsApp,
        # un gestionnaire de fichiers, ou une autre app. Fait via Node (et
        # non sed) car il faut inserer a l'interieur du bloc <activity>
        # precis de MainActivity, pas n'importe ou dans le fichier.
        node -e "
        const fs = require('fs');
        const manifestPath = 'android/app/src/main/AndroidManifest.xml';
        let manifest = fs.readFileSync(manifestPath, 'utf8');

        const mimeTypes = [
          'application/pdf',
          'application/msword',
          'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
          'application/vnd.ms-excel',
          'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
          'application/vnd.ms-excel.sheet.macroEnabled.12'
        ];
        const dataTags = mimeTypes.map(m => '            <data android:mimeType=\"' + m + '\" />').join('\n');

        const intentFilters = '\n' +
          '        <intent-filter android:label=\"Ouvrir avec Lecteur Multi-Formats\">\n' +
          '            <action android:name=\"android.intent.action.VIEW\" />\n' +
          '            <category android:name=\"android.intent.category.DEFAULT\" />\n' +
          '            <category android:name=\"android.intent.category.BROWSABLE\" />\n' +
          dataTags + '\n' +
          '        </intent-filter>\n' +
          '        <intent-filter android:label=\"Ouvrir avec Lecteur Multi-Formats\">\n' +
          '            <action android:name=\"android.intent.action.SEND\" />\n' +
          '            <category android:name=\"android.intent.category.DEFAULT\" />\n' +
          dataTags + '\n' +
          '        </intent-filter>\n';

        const activityRegex = /(<activity\b[^>]*android:name=\"\.MainActivity\"[^>]*>)([\s\S]*?)(<\/activity>)/;
        const match = manifest.match(activityRegex);
        if (match) {
          manifest = manifest.replace(activityRegex, '\$1\$2' + intentFilters + '\$3');
          fs.writeFileSync(manifestPath, manifest);
          console.log('AndroidManifest.xml : intent-filters VIEW/SEND ajoutés à MainActivity.');
        } else {
          console.warn('ATTENTION : bloc <activity> de MainActivity introuvable, intent-filters non ajoutés.');
          process.exit(1);
        }
        "

    - name: Activation du zoom (pincement) dans le WebView Android
      run: |
        # MainActivity.java par defaut ne configure pas le WebView pour
        # accepter le pincement de zoom. On regenere ce fichier avec les
        # bons reglages, a partir de l'appId declare dans capacitor.config.json.
        # (Ecrit via Node plutot qu'un heredoc bash, pour eviter les pieges
        # d'indentation dans un fichier YAML.)
        node -e "
        const fs = require('fs');
        const path = require('path');
        const appId = require('./capacitor.config.json').appId;
        const pkgPath = appId.split('.').join('/');
        const dir = path.join('android/app/src/main/java', pkgPath);
        fs.mkdirSync(dir, { recursive: true });
        const content = [
          'package ' + appId + ';',
          '',
          'import android.content.ContentResolver;',
          'import android.content.Intent;',
          'import android.content.pm.PackageManager;',
          'import android.database.Cursor;',
          'import android.net.Uri;',
          'import android.os.Build;',
          'import android.os.Bundle;',
          'import android.os.Environment;',
          'import android.provider.OpenableColumns;',
          'import android.provider.Settings;',
          'import android.util.Base64;',
          'import android.webkit.JavascriptInterface;',
          'import android.webkit.WebSettings;',
          'import androidx.core.app.ActivityCompat;',
          'import androidx.core.content.ContextCompat;',
          'import com.getcapacitor.BridgeActivity;',
          'import java.io.ByteArrayOutputStream;',
          'import java.io.InputStream;',
          '',
          'public class MainActivity extends BridgeActivity {',
          '    // Code de requete utilise pour la demande de permission stockage',
          '    // \"classique\" (Android 6 a 10). Sur Android 11+, il n y a pas de',
          '    // boite de dialogue : voir StoragePermissionBridge.requestStorageAccess().',
          '    private static final int STORAGE_PERMISSION_REQUEST_CODE = 4501;',
          '',
          '    // Fichier recu depuis une autre app (WhatsApp \"Ouvrir avec\"/\"Partager\"),',
          '    // en attente d etre recupere par le JS via IncomingFileBridge.',
          '    private volatile String pendingIncomingFileName = null;',
          '    private volatile String pendingIncomingFileMimeType = null;',
          '    private volatile String pendingIncomingFileBase64 = null;',
          '',
          '    @Override',
          '    public void onCreate(Bundle savedInstanceState) {',
          '        super.onCreate(savedInstanceState);',
          '        WebSettings settings = this.bridge.getWebView().getSettings();',
          '        settings.setSupportZoom(true);',
          '        settings.setBuiltInZoomControls(true);',
          '        settings.setDisplayZoomControls(false);',
          '',
          '        this.bridge.getWebView().addJavascriptInterface(',
          '            new StoragePermissionBridge(this), \"StoragePermissionBridge\"',
          '        );',
          '        this.bridge.getWebView().addJavascriptInterface(',
          '            new IncomingFileBridge(), \"IncomingFileBridge\"',
          '        );',
          '',
          '        handleIncomingFileIntent(getIntent());',
          '    }',
          '',
          '    // Appele quand l app est deja ouverte (mode singleTask) et qu on',
          '    // choisit \"Lecteur Multi-Formats\" depuis WhatsApp ou un autre',
          '    // gestionnaire de fichiers pour ouvrir/partager un document.',
          '    @Override',
          '    public void onNewIntent(Intent intent) {',
          '        super.onNewIntent(intent);',
          '        setIntent(intent);',
          '        handleIncomingFileIntent(intent);',
          '    }',
          '',
          '    // Lit en arriere-plan le fichier recu via une intent VIEW (\"Ouvrir',
          '    // avec\") ou SEND (\"Partager vers\"), puis previent le JS des que le',
          '    // contenu est pret a etre recupere via IncomingFileBridge.',
          '    private void handleIncomingFileIntent(final Intent intent) {',
          '        if (intent == null) return;',
          '        final String action = intent.getAction();',
          '        Uri uri = null;',
          '        if (Intent.ACTION_VIEW.equals(action)) {',
          '            uri = intent.getData();',
          '        } else if (Intent.ACTION_SEND.equals(action)) {',
          '            uri = intent.getParcelableExtra(Intent.EXTRA_STREAM);',
          '        }',
          '        if (uri == null) return;',
          '        final Uri fileUri = uri;',
          '        final MainActivity activity = this;',
          '        new Thread(new Runnable() {',
          '            @Override',
          '            public void run() {',
          '                try {',
          '                    ContentResolver resolver = activity.getContentResolver();',
          '                    String name = null;',
          '                    Cursor cursor = resolver.query(fileUri, null, null, null, null);',
          '                    if (cursor != null) {',
          '                        try {',
          '                            int idx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME);',
          '                            if (idx >= 0 && cursor.moveToFirst()) {',
          '                                name = cursor.getString(idx);',
          '                            }',
          '                        } finally {',
          '                            cursor.close();',
          '                        }',
          '                    }',
          '                    if (name == null) {',
          '                        name = fileUri.getLastPathSegment();',
          '                    }',
          '                    String mimeType = resolver.getType(fileUri);',
          '                    if (mimeType == null) mimeType = intent.getType();',
          '',
          '                    InputStream input = resolver.openInputStream(fileUri);',
          '                    ByteArrayOutputStream buffer = new ByteArrayOutputStream();',
          '                    byte[] chunk = new byte[16384];',
          '                    int read;',
          '                    while (input != null && (read = input.read(chunk)) != -1) {',
          '                        buffer.write(chunk, 0, read);',
          '                    }',
          '                    if (input != null) input.close();',
          '',
          '                    activity.pendingIncomingFileName = name;',
          '                    activity.pendingIncomingFileMimeType = mimeType;',
          '                    activity.pendingIncomingFileBase64 = Base64.encodeToString(buffer.toByteArray(), Base64.NO_WRAP);',
          '',
          '                    final String js = \"window.checkForIncomingNativeFile && window.checkForIncomingNativeFile();\";',
          '                    activity.bridge.getWebView().post(new Runnable() {',
          '                        @Override',
          '                        public void run() {',
          '                            activity.bridge.getWebView().evaluateJavascript(js, null);',
          '                        }',
          '                    });',
          '                } catch (Exception e) {',
          '                    e.printStackTrace();',
          '                }',
          '            }',
          '        }).start();',
          '    }',
          '',
          '    // Recoit le resultat de la boite de dialogue classique (Android < 11)',
          '    // demandee via StoragePermissionBridge.requestStorageAccess(), et le',
          '    // transmet au JS pour qu il relance le scan automatiquement si accepte.',
          '    @Override',
          '    public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {',
          '        super.onRequestPermissionsResult(requestCode, permissions, grantResults);',
          '        if (requestCode == STORAGE_PERMISSION_REQUEST_CODE) {',
          '            boolean granted = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;',
          '            final String js = \"window.onNativeStoragePermissionResult && window.onNativeStoragePermissionResult(\" + granted + \");\";',
          '            this.bridge.getWebView().post(new Runnable() {',
          '                @Override',
          '                public void run() {',
          '                    bridge.getWebView().evaluateJavascript(js, null);',
          '                }',
          '            });',
          '        }',
          '    }',
          '',
          '    // Pont JS -> natif pour l acces complet au stockage. Deux methodes :',
          '    // isStorageAccessGranted() verifie sans rien demander, et',
          '    // requestStorageAccess() declenche la bonne demande selon la version',
          '    // d Android (boite de dialogue classique avant Android 11, ecran de',
          '    // Reglages dedie \"Acces a tous les fichiers\" a partir d Android 11,',
          '    // car aucune boite de dialogue standard ne peut la declencher).',
          '    // Appele depuis index.html via window.StoragePermissionBridge.*',
          '    public class StoragePermissionBridge {',
          '        private final MainActivity activity;',
          '',
          '        StoragePermissionBridge(MainActivity activity) {',
          '            this.activity = activity;',
          '        }',
          '',
          '        @JavascriptInterface',
          '        public boolean isStorageAccessGranted() {',
          '            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {',
          '                return Environment.isExternalStorageManager();',
          '            }',
          '            return ContextCompat.checkSelfPermission(activity, android.Manifest.permission.READ_EXTERNAL_STORAGE)',
          '                == PackageManager.PERMISSION_GRANTED;',
          '        }',
          '',
          '        @JavascriptInterface',
          '        public void requestStorageAccess() {',
          '            activity.runOnUiThread(new Runnable() {',
          '                @Override',
          '                public void run() {',
          '                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {',
          '                        openManageAllFilesSettings();',
          '                    } else {',
          '                        ActivityCompat.requestPermissions(',
          '                            activity,',
          '                            new String[]{',
          '                                android.Manifest.permission.READ_EXTERNAL_STORAGE,',
          '                                android.Manifest.permission.WRITE_EXTERNAL_STORAGE',
          '                            },',
          '                            STORAGE_PERMISSION_REQUEST_CODE',
          '                        );',
          '                    }',
          '                }',
          '            });',
          '        }',
          '',
          '        @JavascriptInterface',
          '        public void openManageAllFilesSettings() {',
          '            activity.runOnUiThread(new Runnable() {',
          '                @Override',
          '                public void run() {',
          '                    try {',
          '                        Intent intent;',
          '                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {',
          '                            intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);',
          '                            intent.setData(Uri.parse(\"package:\" + activity.getPackageName()));',
          '                        } else {',
          '                            intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);',
          '                            intent.setData(Uri.parse(\"package:\" + activity.getPackageName()));',
          '                        }',
          '                        activity.startActivity(intent);',
          '                    } catch (Exception e) {',
          '                        Intent fallback = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);',
          '                        fallback.setData(Uri.parse(\"package:\" + activity.getPackageName()));',
          '                        activity.startActivity(fallback);',
          '                    }',
          '                }',
          '            });',
          '        }',
          '    }',
          '',
          '    // Pont JS -> natif pour recuperer le fichier recu depuis une autre',
          '    // app (WhatsApp \"Ouvrir avec\"/\"Partager\"). Le JS appelle ces',
          '    // methodes depuis window.checkForIncomingNativeFile() (voir index.html).',
          '    public class IncomingFileBridge {',
          '        @JavascriptInterface',
          '        public String getPendingFileName() {',
          '            return pendingIncomingFileName;',
          '        }',
          '',
          '        @JavascriptInterface',
          '        public String getPendingFileMimeType() {',
          '            return pendingIncomingFileMimeType;',
          '        }',
          '',
          '        @JavascriptInterface',
          '        public String getPendingFileBase64() {',
          '            return pendingIncomingFileBase64;',
          '        }',
          '',
          '        @JavascriptInterface',
          '        public void clearPendingFile() {',
          '            pendingIncomingFileName = null;',
          '            pendingIncomingFileMimeType = null;',
          '            pendingIncomingFileBase64 = null;',
          '        }',
          '    }',
          '}',
          ''
        ].join('\n');
        fs.writeFileSync(path.join(dir, 'MainActivity.java'), content);
        console.log('MainActivity.java mis à jour (zoom + pont permission stockage) :', path.join(dir, 'MainActivity.java'));
        console.log(content);
        "

    - name: Synchronisation finale des scripts (libs) et du code web
      run: npx cap sync android

    - name: Autorisation d'exécution Gradle
      run: chmod +x android/gradlew

    - name: Compilation de l'APK Natif
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Téléchargement de ton fichier APK
      uses: actions/upload-artifact@v4
      with:
        name: MonApp-Native-Complete
        path: android/app/build/outputs/apk/debug/app-debug.apk
